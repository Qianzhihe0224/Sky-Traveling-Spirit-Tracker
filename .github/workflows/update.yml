name: Update data & deploy

on:
  schedule:
    # 每天北京时间 13:00（GitHub cron 用 UTC，13:00 CST = 05:00 UTC）
    - cron: '0 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    # 机器人自己提交数据后推送的 commit 不再触发整条流水线，避免重复部署
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync official announcements (大神 Sky光遇)
        run: node scripts/sync-dashen.mjs

      - name: Sync community wiki records (补名字/核对)
        continue-on-error: true
        run: node scripts/fetch-wiki.mjs

      - name: Classify, merge, validate
        run: |
          node scripts/classify.mjs
          node scripts/import-data.mjs
          node scripts/predict.mjs
          node scripts/build.mjs
          node scripts/smoke.mjs

      - name: Assemble static site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -r assets _site/assets
          cp data/app-data.js _site/data/app-data.js
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
